:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface2: #F0EEE8;
  --text: #16202B;
  --muted: #5B6878;
  --line: #E4E2DB;
  --accent: #E8542F;
  --accent-soft: #FBEAE4;
  --free: #1E8E4D;
  --free-soft: #E3F3E9;
  --chip-on-text: #FFFFFF;
  --shadow: 0 1px 2px rgba(22, 32, 43, .06), 0 8px 24px rgba(22, 32, 43, .05);
  --c-concert: #2C7BC7;
  --c-theater: #8A56C2;
  --c-party: #D6437E;
  --c-show: #C67715;
  --c-digitel: #14897F;
  --c-festival: #5B9432;
  --c-standup: #B9860B;
  --c-culture: #6B67C9;
  --c-free: #1E8E4D;
  --c-other: #64748B;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1118;
    --surface: #141B26;
    --surface2: #1B2432;
    --text: #EDF1F6;
    --muted: #8C99AB;
    --line: #243040;
    --accent: #FF6B4A;
    --accent-soft: #33201B;
    --free: #58C482;
    --free-soft: #16301F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25);
    --c-concert: #5EA8EE;
    --c-theater: #B58AE6;
    --c-party: #F27AA9;
    --c-show: #E8A04C;
    --c-digitel: #46BFB4;
    --c-festival: #8FBE5F;
    --c-standup: #E5C05A;
    --c-culture: #9C98E8;
    --c-free: #58C482;
    --c-other: #93A1B3;
  }
}
:root[data-theme="light"] {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface2: #F0EEE8;
  --text: #16202B;
  --muted: #5B6878;

* { box-sizing: border-box; }
html { direction: rtl; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Rubik', -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

header.hero { padding: 44px 0 20px; }
.hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 {
  font-family: 'Secular One', 'Rubik', sans-serif;
  font-weight: 400;
  font-size: clamp(34px, 6vw, 52px);
  margin: 0;
  line-height: 1.1;
  text-wrap: balance;
}
h1 .dot { color: var(--accent); }
.tagline { color: var(--muted); margin: 6px 0 0; font-size: 17px; }
.stats {
  display: flex; gap: 20px; flex-wrap: wrap;
  margin-top: 18px; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums;
}
.stat { display: flex; flex-direction: column; }
.stat b { font-size: 22px; font-weight: 700; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }
.stat b.free-n { color: var(--free); }
.stat b.today-n { color: var(--accent); }
.updated { margin-inline-start: auto; align-self: center; font-size: 13px; color: var(--muted); text-align: left; }

.filters {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: 14px 0 12px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 10px;
}
.search-row { display: flex; gap: 10px; flex-wrap: wrap; }
input[type="search"] {
  flex: 1; min-width: 220px;
  padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--text);
  font: inherit; font-size: 15px;
}
input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
input[type="search"]::placeholder { color: var(--muted); }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cal-toggle { display: inline-flex; align-items: center; gap: 6px; }
.cal-toggle svg { flex: none; }
.cal-pop {
  position: absolute; top: calc(100% + 6px); inset-inline-start: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 14px; width: 316px; max-width: calc(100vw - 40px);
  z-index: 30;
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-weight: 700; font-size: 15px; }
.cal-nav {
  border: 1px solid var(--line); background: var(--surface2); color: var(--text);
  width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1;
}
.cal-nav:hover:not(:disabled) { border-color: var(--muted); }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; }
.cal-day {
  position: relative; height: 38px; border: none; background: none; border-radius: 9px;
  font: inherit; font-size: 13.5px; color: var(--text); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.cal-day:hover { background: var(--surface2); }
.cal-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-day.empty-day { color: var(--muted); opacity: .45; cursor: default; }
.cal-day.empty-day:hover { background: none; }
.cal-day .d {
  position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.cal-day.many .d { width: 14px; height: 4px; border-radius: 3px; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-day.sel { background: var(--text); color: var(--bg); }
.cal-day.sel .d { background: var(--bg); }
.day.flash .day-head { animation: dayFlash 1.6s ease; border-radius: 8px; }
@keyframes dayFlash { 0%, 35% { background: var(--accent-soft); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .day.flash .day-head { animation: none; } }
.pill {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.pill:hover { border-color: var(--muted); }
.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pill.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.pill.free-pill.on { background: var(--free); border-color: var(--free); color: #fff; }
.row-label { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-inline-end: 2px; }

.cat-chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13.5px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.cat-chip .cdot { width: 9px; height: 9px; border-radius: 50%; background: var(--cc, var(--c-other)); flex: none; }
.cat-chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cat-chip:hover { border-color: var(--cc, var(--muted)); }
.cat-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cat-chip.on { background: var(--cc, var(--c-other)); border-color: var(--cc, var(--c-other)); color: var(--chip-on-text); }
.cat-chip.on .n { color: var(--chip-on-text); opacity: .8; }

.day { margin-top: 34px; }
.day-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.day-head h2 {
  font-family: 'Secular One', 'Rubik', sans-serif; font-weight: 400;
  font-size: 22px; margin: 0;
}
.day-head .rel {
  font-size: 12.5px; font-weight: 500; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px; padding: 3px 10px;
}
.day-head .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.day-head::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 16px 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 8px;
  position: relative;
  transition: transform .12s ease, border-color .12s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--cc, var(--muted)); }
@media (prefers-reduced-motion: reduce) {
  .card, .card:hover { transition: none; transform: none; }
}
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2.5px 10px;

  const holder = document.getElementById('cat-chips');
  holder.querySelectorAll('.cat-chip').forEach(el => el.remove());
  const cats = Object.keys(CAT_VARS).filter(c => live.some(e => e.category === c));
  for (const c of cats) {
    const b = document.createElement('button');
    b.className = 'cat-chip' + (state.cats.has(c) ? ' on' : '');
    b.style.setProperty('--cc', `var(${CAT_VARS[c]})`);
    b.innerHTML = `<span class="cdot"></span>${esc(c)} <span class="n">${counts[c] || 0}</span>`;
    b.onclick = () => { state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); render(); };
    holder.appendChild(b);
  }
}

// stats
document.getElementById('st-total').textContent = live.length;
document.getElementById('st-today').textContent = live.filter(e => e.sortDate <= TODAY && (e.endDate || e.date) >= TODAY).length;
document.getElementById('st-weekend').textContent = live.filter(e => e.sortDate <= WK_END && (e.endDate || e.date) >= WK_START).length;
document.getElementById('st-free').textContent = live.filter(e => e.isFree).length;
document.getElementById('updated').textContent = UPDATED ? 'עודכן: ' + UPDATED : '';
(function () {
  const days = Math.round((new Date(TODAY + 'T12:00:00') - new Date(UPDATED_ISO + 'T12:00:00')) / 864e5);
  if (days < 7) return;
  const el = document.getElementById('stale');
  el.textContent = `הרשימה עודכנה לפני ${days} ימים, אז אירועים חדשים עלולים להיות חסרים. אפשר לבקש ריענון.`;
  el.hidden = false;
})();
document.getElementById('src-count').textContent = new Set(EVENTS.map(e => e.source)).size;
document.getElementById('srcs').textContent = [...new Set(EVENTS.map(e => e.source))].join(' · ');

// filter wiring
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
document.querySelectorAll('#date-pills .pill[data-range]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#date-pills .pill[data-range]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state.range = b.dataset.range;
    render();
  };
});
document.getElementById('free-toggle').onclick = function () {
  state.freeOnly = !state.freeOnly; this.classList.toggle('on', state.freeOnly); render();
};
document.getElementById('tlv-toggle').onclick = function () {
  state.tlvOnly = !state.tlvOnly; this.classList.toggle('on', state.tlvOnly); render();
};

render();
</script>
